name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - run: npm ci

      - run: npx tsc --noEmit

      - run: npm run lint

      # The vitest suite mocks the database layer and needs no Postgres service.
      - run: npx vitest run

      - run: npm run build
